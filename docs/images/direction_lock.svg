<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="t d"><title id="t">Clockwise and counterclockwise direction detection</title><desc id="d">Orange below blue means clockwise; blue below orange means counterclockwise. Both line centres must be at least twenty pixels apart and agree for three consecutive frames.</desc><rect width="940" height="420" rx="18" fill="#0d1b2a"/><text x="30" y="40" fill="#eff7fa" font-family="Arial" font-size="24" font-weight="bold">Camera direction lock</text><text x="30" y="66" fill="#adc8d3" font-family="Arial" font-size="15">Lower in the image = larger y coordinate = closer to the camera</text><g font-family="Arial"><rect x="30" y="92" width="425" height="245" rx="12" fill="#183344" stroke="#4b778a"/><text x="50" y="125" fill="#f0f7fa" font-size="19" font-weight="bold">CLOCKWISE · right corners</text><path d="M70 176H410" stroke="#6bb8ff" stroke-width="12" stroke-linecap="round"/><text x="72" y="162" fill="#b8dcff" font-size="14">Blue higher</text><path d="M70 261H410" stroke="#ffab59" stroke-width="12" stroke-linecap="round"/><text x="72" y="248" fill="#ffd0a2" font-size="14">Orange lower</text><rect x="485" y="92" width="425" height="245" rx="12" fill="#183344" stroke="#4b778a"/><text x="505" y="125" fill="#f0f7fa" font-size="19" font-weight="bold">COUNTERCLOCKWISE · left corners</text><path d="M525 176H865" stroke="#ffab59" stroke-width="12" stroke-linecap="round"/><text x="527" y="162" fill="#ffd0a2" font-size="14">Orange higher</text><path d="M525 261H865" stroke="#6bb8ff" stroke-width="12" stroke-linecap="round"/><text x="527" y="248" fill="#b8dcff" font-size="14">Blue lower</text><rect x="30" y="355" width="880" height="43" rx="9" fill="#1c4149"/><text x="48" y="382" fill="#d4f6e9" font-size="16" font-weight="bold">Both colours visible · centre gap ≥ 20 px · same order for 3 frames → lock</text></g></svg>