<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Current Pi 5 and Build HAT robot</title>
<desc id="desc">Hiwonder USB camera to Raspberry Pi 5, Build HAT to LEGO steering and drive motors, Force Sensor on port C.</desc>
<rect width="1000" height="380" rx="24" fill="#101b2c"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#f1f6ff">
<text x="500" y="48" font-size="25" font-weight="bold">Current vehicle hardware</text>
<rect x="32" y="98" width="200" height="88" rx="13" fill="#146e85"/><text x="132" y="134" font-size="19">Hiwonder USB</text><text x="132" y="161" font-size="19">camera</text>
<rect x="307" y="98" width="205" height="88" rx="13" fill="#306246"/><text x="409" y="149" font-size="21">Raspberry Pi 5</text>
<rect x="585" y="98" width="190" height="88" rx="13" fill="#5b418e"/><text x="680" y="149" font-size="21">Build HAT</text>
<rect x="793" y="81" width="183" height="74" rx="13" fill="#a2661a"/><text x="884" y="111" font-size="16">LEGO steering</text><text x="884" y="134" font-size="16">motor*</text>
<rect x="793" y="181" width="183" height="74" rx="13" fill="#a2661a"/><text x="884" y="210" font-size="16">LEGO drive</text><text x="884" y="233" font-size="16">motor*</text>
<rect x="585" y="263" width="190" height="74" rx="13" fill="#146e85"/><text x="680" y="292" font-size="16">Force Sensor</text><text x="680" y="315" font-size="16">port C</text>
<text x="500" y="362" font-size="14" fill="#adc0d2">*Motor port assignments are provisional; calibrate on the robot</text>
</g>
<g stroke="#aee7e8" stroke-width="5" fill="none" stroke-linecap="round"><path d="M232 142h75"/><path d="M512 142h73"/><path d="M775 126h18"/><path d="M775 169q12 0 18 49"/><path d="M680 263v-77"/></g>
</svg>
